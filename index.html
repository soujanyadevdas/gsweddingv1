<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soujanya & Gaurav</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Allura&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="hero">

        <!-- Envelope -->
        <img src="frontpageenvelope.png" class="hero-image" alt="Envelope">

        <!-- Top Text -->
        <div class="text-top">
            MESSAGE FROM
        </div>

        <!-- Couple Name -->
        <div class="names">
            Gaurav &amp; Soujanya
        </div>

        <!-- Wax Seal -->
        <!-- <img src="seal.png" class="seal" id="seal" alt="Wax Seal"> -->

        <!-- Tap Text -->
        <div class="tap-text">
            TAP TO OPEN
        </div>

        <div id="sealButton"></div>

    </section>

    <section class="invitation-page" id="invitationPage">

        <img src="page2.png" class="page2-image">

        <button id="continueBtn">
            Open Invitation
        </button>

    </section>

    <!-- Background Music -->
    <audio id="bgMusic" preload="auto" loop>
        <source src="gsweddingbg.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>

</html>
